pre-commit:
    commands:
        gitleaks:
            run: gitleaks protect --staged --redact --verbose
        check:
            run: just hook-pre-commit

pre-push:
    commands:
        test-unit:
            run: just hook-pre-push

post-checkout:
    commands:
        install-deps:
            run: |
                is_branch="$3"
                if [ "$is_branch" = "1" ] && [ -f package.json ] && [ ! -d node_modules ]; then
                  echo "post-checkout: running bun install for new worktree/branch"
                  bun install
                fi

post-merge:
    commands:
        ci-main:
            run: just hook-post-merge

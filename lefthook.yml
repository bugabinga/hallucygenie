pre-commit:
    commands:
        gitleaks:
            run: gitleaks protect --staged --redact --verbose
        ready:
            run: just ready

pre-push:
    commands:
        ready:
            run: just ready

post-checkout:
    commands:
        install-deps:
            run: |
                is_branch="$3"
                if [ "$is_branch" = "1" ] && [ -f package.json ] && [ ! -d node_modules ]; then
                  echo "post-checkout: running bun install for new worktree/branch"
                  bun install
                fi

post-merge:
    commands:
        ready:
            run: just ready

pre-commit:
    commands:
        gitleaks:
            run: gitleaks protect --staged --redact --verbose
        check:
            run: mise run check && mise run test

pre-push:
    commands:
        check:
            run: mise run check && mise run test

post-checkout:
    commands:
        setup:
            run: |
                is_branch="$3"
                if [ "$is_branch" = "1" ] && [ -f package.json ] && [ ! -d node_modules ]; then
                  echo "post-checkout: running mise setup for new worktree/branch"
                  mise run setup
                fi

post-merge:
    commands:
        check:
            run: mise run check && mise run test

name: CI

on:
    push:
        branches: [trunk]
    pull_request:
    workflow_dispatch:

jobs:
    test:
        name: check + unit + integration + e2e
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.14
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-bun-
            - uses: taiki-e/install-action@v2.82.0
              with:
                  tool: just
            - name: Install sqruff
              run: python -m pip install sqruff==0.38.0
            - uses: browser-actions/setup-chrome@v2.1.2
              id: setup-chrome
              with:
                  install-dependencies: true
            - name: Use Chrome for E2E
              run: echo "CHROMIUM_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
            - name: Install deps
              run: bun install --frozen-lockfile
            - name: Ready
              run: just ready

    mutation:
        name: mutation
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.14
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-bun-
            - uses: taiki-e/install-action@v2.82.0
              with:
                  tool: just
            - name: Install deps
              run: bun install --frozen-lockfile
            - name: Mutation tests
              run: just mutation
            - name: Upload mutation reports
              if: ${{ always() }}
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: mutation-reports
                  path: reports/mutation/
                  if-no-files-found: ignore

    container:
        name: container build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.14
            - uses: taiki-e/install-action@v2.82.0
              with:
                  tool: just
            - name: Build container
              run: just container hallucygenie:ci

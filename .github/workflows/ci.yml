name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    test:
        name: check + unit + integration + e2e
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.13
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-bun-
            - uses: taiki-e/install-action@v2.75.28
              with:
                  tool: just
            - uses: browser-actions/setup-chrome@v2.1.1
              id: setup-chrome
              with:
                  install-dependencies: true
            - name: Use Chrome for E2E
              run: echo "CHROMIUM_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
            - name: Install deps
              run: bun install --frozen-lockfile
            - name: Check, unit, integration
              run: just ci-test-all
            - name: E2E
              run: just test-e2e

    mutation:
        name: mutation
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.13
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-bun-
            - uses: taiki-e/install-action@v2.75.28
              with:
                  tool: just
            - name: Install deps
              run: bun install --frozen-lockfile
            - name: Mutation tests
              run: just test-mutation
            - name: Upload mutation reports
              if: always()
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: mutation-reports
                  path: reports/mutation/
                  if-no-files-found: ignore

    container:
        name: container build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6.0.2
            - name: Build container
              if: ${{ !env.ACT }}
              run: docker build -f deploy/Dockerfile -t hallucygenie:ci .
            - name: Skip nested container build under act
              if: ${{ env.ACT }}
              run: echo "act + Podman cannot run nested BuildKit here; use just container-build"

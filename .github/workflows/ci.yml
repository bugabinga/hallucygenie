name: CI

on:
    push:
        branches: [trunk]
    pull_request:
    workflow_dispatch:

jobs:
    check:
        name: check
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: jdx/mise-action@v4.2.0
              with:
                  cache: true
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-
            - name: Setup JS deps
              run: mise run setup --js
            - name: Check
              run: mise run check

    e2e:
        name: e2e (${{ matrix.browser }}, ${{ matrix.device }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox]
                device: [desktop, mobile]
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: jdx/mise-action@v4.2.0
              with:
                  cache: true
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-playwright-
            - name: Setup JS deps
              run: mise run setup --js
            - name: Setup browsers
              run: mise run setup --browsers
            - name: E2E
              run: mise run test --e2e
              env:
                  HG_E2E_BROWSER: ${{ matrix.browser }}
                  HG_E2E_DEVICE: ${{ matrix.device }}

    mutation:
        name: mutation
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: jdx/mise-action@v4.2.0
              with:
                  cache: true
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-
            - name: Setup JS deps
              run: mise run setup --js
            - name: Mutation tests
              run: mise run test --mutation
            - name: Upload mutation reports
              if: ${{ always() }}
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: mutation-reports
                  path: reports/mutation/
                  if-no-files-found: ignore

    image:
        name: image build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: jdx/mise-action@v4.2.0
              with:
                  cache: true
            - name: Build image
              run: mise run image hallucygenie:ci

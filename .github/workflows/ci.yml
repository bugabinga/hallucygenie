name: CI

on:
    push:
        branches: [trunk]
    pull_request:
    workflow_dispatch:

jobs:
    check:
        name: check
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: jdx/mise-action@v3
              with:
                  cache: true
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-
            - name: Setup JS deps
              run: mise run setup --js
            - name: Setup media tools
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
            - name: Check
              run: mise run check

    e2e:
        name: e2e (${{ matrix.browser }}, ${{ matrix.device }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox]
                device: [desktop, mobile]
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: jdx/mise-action@v3
              with:
                  cache: true
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-playwright-
            - name: Setup JS deps
              run: mise run setup --js
            - name: Setup browsers
              run: mise run setup --browsers
            - name: E2E
              run: mise run test --e2e
              env:
                  HG_E2E_BROWSER: ${{ matrix.browser }}
                  HG_E2E_DEVICE: ${{ matrix.device }}

    integration:
        name: check + unit + integration + e2e
        needs: [check, e2e]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        steps:
            - name: Require check and every E2E variant
              env:
                  CHECK_RESULT: ${{ needs.check.result }}
                  E2E_RESULT: ${{ needs.e2e.result }}
              run: test "$CHECK_RESULT" = success && test "$E2E_RESULT" = success

    mutation:
        name: mutation
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: jdx/mise-action@v3
              with:
                  cache: true
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-
            - name: Setup JS deps
              run: mise run setup --js
            - name: Mutation tests
              run: mise run test --mutation
            - name: Upload mutation reports
              if: ${{ always() }}
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: mutation-reports
                  path: reports/mutation/
                  if-no-files-found: ignore

    image:
        name: container build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: jdx/mise-action@v3
              with:
                  cache: true
            - name: Setup JS deps
              run: mise run setup --js
            - name: Setup browsers
              run: mise run setup --browsers
            - name: Setup media tools
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
            - name: Prove release without publication
              run: mise run release --check hallucygenie:ci

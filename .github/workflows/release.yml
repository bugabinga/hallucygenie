name: Release

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag, e.g. v1.0.0"
                required: true
                type: string

permissions:
    contents: read
    packages: write

jobs:
    ghcr:
        name: release image
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            IMAGE: ghcr.io/bugabinga/hallucygenie
            RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: jdx/mise-action@v3
              with:
                  cache: true
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-playwright-
            - name: Setup JS deps
              run: mise run setup --js
            - name: Setup browsers
              run: mise run setup --browsers
            - name: Prove release artifact locally
              run: RELEASE_TAG="$RELEASE_TAG" mise run release --check "$IMAGE:$RELEASE_TAG"
            - name: Login to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
            - name: Publish OCI image
              run: mise run image --push "$IMAGE:$RELEASE_TAG"

name: Release

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag, e.g. v1.0.0"
                required: true
                type: string

permissions:
    contents: read
    packages: write

jobs:
    ghcr:
        name: release image
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            IMAGE: ghcr.io/bugabinga/hallucygenie
            RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        steps:
            - uses: actions/checkout@v7.0.0
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.14
            - uses: taiki-e/install-action@v2.82.6
              with:
                  tool: just
            - name: Install sqruff
              run: python -m pip install sqruff==0.38.0
            - uses: browser-actions/setup-chrome@v2.1.2
              id: setup-chrome
              with:
                  install-dependencies: true
            - name: Use Chrome for E2E
              run: echo "CHROMIUM_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
            - name: Install deps
              run: bun install --frozen-lockfile
            - name: Prove release artifact locally
              run: RELEASE_TAG="$RELEASE_TAG" just release-check "$IMAGE:$RELEASE_TAG"
            - name: Login to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
            - name: Publish OCI image
              run: just publish-container "$IMAGE:$RELEASE_TAG"

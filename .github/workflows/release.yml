name: Release

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag, e.g. v1.0.0"
                required: true
                type: string

permissions:
    contents: read
    packages: write

jobs:
    ghcr:
        name: release image
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            IMAGE: ghcr.io/bugabinga/hallucygenie
            RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.14
            - uses: taiki-e/install-action@v2.79.7
              with:
                  tool: just
            - uses: browser-actions/setup-chrome@v2.1.2
              id: setup-chrome
              with:
                  install-dependencies: true
            - name: Use Chrome for E2E
              run: echo "CHROMIUM_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
            - name: Install deps
              run: bun install --frozen-lockfile
            - name: Prove release artifact locally
              run: RELEASE_TAG="$RELEASE_TAG" just release-check "$IMAGE:$RELEASE_TAG"
            - uses: docker/setup-buildx-action@v4.0.0
            - uses: docker/login-action@v4.0.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/metadata-action@v6.0.0
              id: meta
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
                      type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
                      type=raw,value=${{ env.RELEASE_TAG }}
                  flavor: |
                      latest=false
            - uses: docker/build-push-action@v7.0.0
              with:
                  context: .
                  file: deploy/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VERSION=${{ env.RELEASE_TAG }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

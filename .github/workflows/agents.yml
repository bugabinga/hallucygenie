            - run: bun install --frozen-lockfile
            - name: Review bot PRs
              run: bun run --bun .github/agents/janitor.ts
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

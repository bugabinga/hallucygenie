                      fi
                      if [ "$(git rev-list --count "origin/${BRANCH}..HEAD")" -eq 0 ]; then
                          echo "No repair changes for existing PR #${PR_NUMBER}"
                          exit 0
                      fi
                      git push --no-verify origin "HEAD:${BRANCH}"
                      exit 0
                  fi
                  if git diff --quiet; then
                      echo "No slop found"
                      exit 0
                  fi
                  BRANCH="agent/slop-chopper-$(date +%Y%m%d-%H%M%S)"
                  git checkout -b "${BRANCH}"
                  just fix
                  just ready

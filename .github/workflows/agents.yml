        if: ${{ inputs.agent == 'janitor' || inputs.agent == 'all' || github.event.schedule == '47 */2 * * *' }}
        name: 🧹 janitor
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: AI api keys
        steps:

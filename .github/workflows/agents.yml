name: Agent Patrol

on:
    schedule:
        - cron: "17 6 * * *"
    workflow_dispatch:
        inputs:
            agent:
                description: "Which agent to run"
                required: true
                type: choice
                options:
                    - speck-ferkel
                    - trouble-maker
                    - slop-chopper
                    - all

permissions:
    contents: write
    pull-requests: write

env:
    PI_OFFLINE: "1"

jobs:
    speck-ferkel:
        if: ${{ inputs.agent == 'speck-ferkel' || inputs.agent == 'all' || github.event_name == 'schedule' }}
        name: 🐖 speck ferkel
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: AI api keys
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.13
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-bun-
            - uses: taiki-e/install-action@v2.75.28
              with:
                  tool: just
            - name: Install gitleaks
              run: |
                  VERSION=$(curl -sL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name' | tr -d 'v')
                  curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | sudo tar xz -C /usr/local/bin gitleaks
            - run: npm install -g @mariozechner/pi-coding-agent
            - run: bun install --frozen-lockfile
            - run: bun run --bun .github/agents/speck-ferkel.ts
              env:
                  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
                  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
            - name: Agent report
              if: always()
              run: |
                  for f in /tmp/pi-agent-findings.md /tmp/pi-agent-pr-body.md; do
                      if [ -f "$f" ]; then
                          echo "## $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
                          echo >> "$GITHUB_STEP_SUMMARY"
                          cat "$f" >> "$GITHUB_STEP_SUMMARY"
                          echo >> "$GITHUB_STEP_SUMMARY"
                      fi
                  done
            - name: Create PR if changes
              run: |
                  git config user.name "speck-ferkel"
                  git config user.email "speck-ferkel@bugabinga.net"
                  if ! git rev-parse --git-dir >/dev/null 2>&1; then
                      echo "No git repo (act local run) — skipping PR"
                      exit 0
                  fi
                  if git diff --quiet; then
                      echo "No drift — spec matches code"
                      exit 0
                  fi
                  SPEC_NAME=$(cat /tmp/pi-agent-spec-name 2>/dev/null || echo "unknown-spec")
                  BRANCH="agent/speck-ferkel-${SPEC_NAME}"
                  git checkout -b "${BRANCH}"
                  just fmt || true
                  git add -A
                  git commit --no-verify -m "🐖 speck-ferkel: fix code to match spec ${SPEC_NAME}"
                  git push --no-verify origin "${BRANCH}"
                  gh pr create \
                      --base trunk \
                      --head "${BRANCH}" \
                      --title "🐖 speck-ferkel: ${SPEC_NAME}" \
                      --body-file /tmp/pi-agent-pr-body.md
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    trouble-maker:
        if: ${{ inputs.agent == 'trouble-maker' || inputs.agent == 'all' || github.event_name == 'schedule' }}
        name: 🔥 trouble maker
        runs-on: ubuntu-latest
        timeout-minutes: 25
        environment: AI api keys
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.13
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-bun-
            - uses: taiki-e/install-action@v2.75.28
              with:
                  tool: just
            - name: Install gitleaks
              run: |
                  VERSION=$(curl -sL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name' | tr -d 'v')
                  curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | sudo tar xz -C /usr/local/bin gitleaks
            - run: npm install -g @mariozechner/pi-coding-agent
            - run: bun install --frozen-lockfile
            - run: bun run --bun .github/agents/trouble-maker.ts
              env:
                  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
                  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
            - name: Agent report
              if: always()
              run: |
                  for f in /tmp/pi-agent-findings.md /tmp/pi-agent-pr-body.md; do
                      if [ -f "$f" ]; then
                          echo "## $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
                          echo >> "$GITHUB_STEP_SUMMARY"
                          cat "$f" >> "$GITHUB_STEP_SUMMARY"
                          echo >> "$GITHUB_STEP_SUMMARY"
                      fi
                  done
            - name: Create PR if changes
              run: |
                  git config user.name "trouble-maker"
                  git config user.email "trouble-maker@bugabinga.net"
                  if ! git rev-parse --git-dir >/dev/null 2>&1; then
                      echo "No git repo (act local run) — skipping PR"
                      exit 0
                  fi
                  if git diff --quiet; then
                      echo "No bugs found"
                      exit 0
                  fi
                  BRANCH="agent/trouble-maker-$(date +%Y%m%d-%H%M%S)"
                  git checkout -b "${BRANCH}"
                  just fmt || true
                  git add -A
                  git commit --no-verify -m "🔥 trouble-maker: fix bugs"
                  git push --no-verify origin "${BRANCH}"
                  gh pr create \
                      --base trunk \
                      --head "${BRANCH}" \
                      --title "🔥 trouble-maker: bugfixes" \
                      --body-file /tmp/pi-agent-pr-body.md
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    slop-chopper:
        if: ${{ inputs.agent == 'slop-chopper' || inputs.agent == 'all' || github.event_name == 'schedule' }}
        name: 🪓 slop chopper
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: AI api keys
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.13
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-bun-
            - uses: taiki-e/install-action@v2.75.28
              with:
                  tool: just
            - name: Install gitleaks
              run: |
                  VERSION=$(curl -sL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name' | tr -d 'v')
                  curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | sudo tar xz -C /usr/local/bin gitleaks
            - run: npm install -g @mariozechner/pi-coding-agent
            - run: bun install --frozen-lockfile
            - run: bun run --bun .github/agents/slop-chopper.ts
              env:
                  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
                  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
            - name: Agent report
              if: always()
              run: |
                  for f in /tmp/pi-agent-findings.md /tmp/pi-agent-pr-body.md; do
                      if [ -f "$f" ]; then
                          echo "## $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
                          echo >> "$GITHUB_STEP_SUMMARY"
                          cat "$f" >> "$GITHUB_STEP_SUMMARY"
                          echo >> "$GITHUB_STEP_SUMMARY"
                      fi
                  done
            - name: Create PR if changes
              run: |
                  git config user.name "slop-chopper"
                  git config user.email "slop-chopper@bugabinga.net"
                  if ! git rev-parse --git-dir >/dev/null 2>&1; then
                      echo "No git repo (act local run) — skipping PR"
                      exit 0
                  fi
                  if git diff --quiet; then
                      echo "No slop found"
                      exit 0
                  fi
                  BRANCH="agent/slop-chopper-$(date +%Y%m%d-%H%M%S)"
                  git checkout -b "${BRANCH}"
                  just fmt || true
                  git add -A
                  git commit --no-verify -m "🪓 slop-chopper: remove slop"
                  git push --no-verify origin "${BRANCH}"
                  gh pr create \
                      --base trunk \
                      --head "${BRANCH}" \
                      --title "🪓 slop-chopper: cleanup" \
                      --body-file /tmp/pi-agent-pr-body.md
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

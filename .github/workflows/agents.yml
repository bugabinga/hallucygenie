name: Agent Patrol

on:
    schedule:
        - cron: "17 */6 * * *"
        - cron: "17 3,9,15,21 * * *"
        - cron: "47 */2 * * *"
    workflow_dispatch:
        inputs:
            agent:
                description: "Which agent to run"
                required: true
                type: choice
                options:
                    - speck-ferkel
                    - trouble-maker
                    - slop-chopper
                    - robotnik
                    - janitor
                    - all

permissions:
    contents: read

env:
    PI_OFFLINE: "1"

jobs:
    speck-ferkel:
        if: ${{ inputs.agent == 'speck-ferkel' || inputs.agent == 'all' || github.event.schedule == '17 */6 * * *' }}
        name: 🐖 speck ferkel
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: AI api keys
        steps:
            - uses: actions/create-github-app-token@v2
              id: app-token
              with:
                  app-id: ${{ secrets.AGENT_BOT_APP_ID }}
                  private-key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
            - uses: actions/checkout@v6.0.2
              with:
                  token: ${{ steps.app-token.outputs.token }}
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.13
            - uses: actions/cache@v5.0.5
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-bun-
            - uses: taiki-e/install-action@v2.75.28
              with:
                  tool: just
            - uses: browser-actions/setup-chrome@v2.1.1
              id: setup-chrome
              with:
                  install-dependencies: true
            - name: Use Chrome for E2E
              run: echo "CHROMIUM_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
            - name: Install gitleaks
              run: |
                  VERSION=$(curl -sL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name' | tr -d 'v')
                  curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | sudo tar xz -C /usr/local/bin gitleaks
            - run: npm install -g @mariozechner/pi-coding-agent
            - run: bun install --frozen-lockfile
            - run: bun run --bun .github/agents/speck-ferkel.ts
              env:
                  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
            - name: Agent report
              if: always()
              run: |
                  for f in /tmp/pi-agent-findings.md /tmp/pi-agent-pr-body.md; do
                      if [ -f "$f" ]; then
                          echo "## $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
                          echo >> "$GITHUB_STEP_SUMMARY"
                          cat "$f" >> "$GITHUB_STEP_SUMMARY"
                          echo >> "$GITHUB_STEP_SUMMARY"
                      fi
                  done
            - name: Create PR if changes
              run: |
                  git config user.name "hallucygenie-agent-bot[bot]"
                  git config user.email "${{ secrets.AGENT_BOT_APP_ID }}+hallucygenie-agent-bot[bot]@users.noreply.github.com"
                  if [ -f /tmp/pi-agent-existing-pr-branch ]; then
                      PR_NUMBER=$(cat /tmp/pi-agent-existing-pr-number)
                      BRANCH=$(cat /tmp/pi-agent-existing-pr-branch)
                      just fix
                      just ready
                      git add -A
                      if [ -f /tmp/pi-agent-pr-update-body.md ]; then
                          gh pr edit "${PR_NUMBER}" --body-file /tmp/pi-agent-pr-update-body.md
                      fi
                      if ! git diff --cached --quiet; then
                          git commit --no-verify -m "🐖 speck-ferkel: address janitor feedback for PR #${PR_NUMBER}"
                      fi
                      if [ "$(git rev-list --count "origin/${BRANCH}..HEAD")" -eq 0 ]; then
                          echo "No repair changes for existing PR #${PR_NUMBER}"
                          exit 0
                      fi
                      git push --no-verify origin "HEAD:${BRANCH}"
                      exit 0
                  fi
                  if git diff --quiet; then
                      echo "No drift — spec matches code"
                      exit 0
                  fi
                  SPEC_NAME=$(cat /tmp/pi-agent-spec-name 2>/dev/null || echo "unknown-spec")
                  BRANCH="agent/speck-ferkel-${SPEC_NAME}"
                  git checkout -b "${BRANCH}"
                  just fix
                  just ready
                  git add -A
                  git commit --no-verify -m "🐖 speck-ferkel: fix code to match spec ${SPEC_NAME}"
                  git push --no-verify origin "${BRANCH}"
                  gh pr create \
                      --base trunk \
                      --head "${BRANCH}" \
                      --title "🐖 speck-ferkel: ${SPEC_NAME}" \
                      --body-file /tmp/pi-agent-pr-body.md
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}

    trouble-maker:

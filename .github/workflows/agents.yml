                          exit 0
                      fi
                      git push --no-verify origin "HEAD:${BRANCH}"
                      exit 0
                  fi
                  if git diff --quiet; then
                      echo "No bugs found"
                      exit 0
                  fi
                  BRANCH="agent/trouble-maker-$(date +%Y%m%d-%H%M%S)"
                  git checkout -b "${BRANCH}"
                  just fix
                  just ready
                  git add -A
                  git commit --no-verify -m "🔥 trouble-maker: fix bugs"
                  git push --no-verify origin "${BRANCH}"
                  gh pr create \
                      --base trunk \
                      --head "${BRANCH}" \
                      --title "🔥 trouble-maker: bugfixes" \
                      --body-file /tmp/pi-agent-pr-body.md
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}

    slop-chopper:
        if: ${{ inputs.agent == 'slop-chopper' || inputs.agent == 'all' || github.event.schedule == '17 */6 * * *' }}
        name: 🪓 slop chopper
        runs-on: ubuntu-latest

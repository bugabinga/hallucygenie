                  BRANCH="agent/robotnik-${ISSUE_ID}-${ISSUE_SLUG}-$(date +%Y%m%d-%H%M%S)"
                  git checkout -b "${BRANCH}"
                  just fix
                  just ready
                  git add -A
                  git commit --no-verify -m "🤖 robotnik: fix ${ISSUE_ID}"
                  git push --no-verify origin "${BRANCH}"
                  gh pr create \
                      --base trunk \
                      --head "${BRANCH}" \
                      --title "🤖 robotnik: ${ISSUE_ID}" \
                      --body-file /tmp/pi-agent-pr-body.md
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}

